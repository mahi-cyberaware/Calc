<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buy Online Report Counter</title><style>
body{font-family:Arial;margin:0;background:#f4f6f9;color:#172033}main{max-width:760px;margin:auto;padding:16px}.card{background:#fff;padding:16px;margin:12px 0;border-radius:14px;border:1px solid #ddd}.upload{display:block;padding:30px;text-align:center;border:2px dashed #98a2b3;border-radius:12px;cursor:pointer}input[type=file]{display:none}.pre{display:flex;gap:8px;overflow:auto;margin-top:10px}.pre img{width:110px;height:85px;object-fit:cover;border-radius:8px}.btn{padding:11px 15px;border:0;border-radius:9px;font-weight:bold;margin:8px 5px 0 0}.go{background:#2563eb;color:#fff}.muted{color:#667085;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.r{padding:12px;border:1px solid #ddd;border-radius:9px}.r b{display:block;font-size:28px;margin-top:3px}.log{background:#101828;color:#fff;padding:10px;border-radius:8px;white-space:pre-wrap;font:12px monospace}.bar{height:6px;background:#eee;margin-top:8px}.bar i{display:block;width:0;height:100%;background:#2563eb}@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}</style></head><body><main>
<div class="card"><h2>🍽️ Buy Online Report Counter</h2><p class="muted">Upload report photos and calculate the six operational counts.</p></div>
<div class="card"><label class="upload" for="files"><b>📷 Upload Report Image(s)</b><br><span class="muted">Take a photo or choose from Photos/Files.</span></label><input id="files" type="file" accept="image/*" multiple><div id="pre" class="pre"></div><p id="status" class="muted">No images selected.</p><div class="bar"><i id="prog"></i></div><button id="go" class="btn go" disabled>Calculate</button><button id="clear" class="btn">Clear</button></div>
<div class="card"><h3>Final Count</h3><div class="grid"><div class="r"><span>Total</span><b id="total">0</b></div><div class="r"><span>Water</span><b id="water">0</b></div><div class="r"><span>Yoghurt</span><b id="yogurt">0</b></div><div class="r"><span>Coffee</span><b id="coffee">0</b></div><div class="r"><span>Paper Tray / Plate</span><b id="tray">0</b></div><div class="r"><span>Cutlery</span><b id="cutlery">0</b></div></div><button id="copy" class="btn">Copy Result</button></div>
<div class="card"><h3>Detected Rows</h3><div id="rows" class="muted">Nothing detected yet.</div></div>
<div class="card"><h3>Activity</h3><div id="log" class="log">Waiting for upload…</div></div>
</main><script>
let files=[],rows=[];const $=x=>document.getElementById(x);
const HOT=new Set(["BUTERC","CPASTA","CBY","RAJMA","CNOODL","CONTIBF","CHANA","JAINVG","CPOP","EGGPIE"]),YOG=new Set(["VBY","CBY"]),WEX=new Set(["KIDSML","WATER"]),COF=new Set(["CONTIBF"]);
function log(x){$("log").textContent+="\n"+x}
function render(){let h=rows.length?'<table style="width:100%;font-size:12px"><tr><th>Page</th><th>Meal</th><th>Qty</th></tr>'+rows.map((r,i)=>`<tr><td>${r.page}</td><td>${r.mealCode}</td><td><input data-i="${i}" type="number" value="${r.quantity}" style="width:60px"></td></tr>`).join("")+'</table>':'Nothing detected yet.';$("rows").innerHTML=h;document.querySelectorAll("[data-i]").forEach(e=>e.onchange=()=>{rows[+e.dataset.i].quantity=+e.value||0;calc()})}
function calc(){let t=0,w=0,y=0,c=0,h=0;rows.forEach(r=>{let q=+r.quantity||0;t+=q;if(!WEX.has(r.mealCode))w+=q;if(YOG.has(r.mealCode))y+=q;if(COF.has(r.mealCode))c+=q;if(HOT.has(r.mealCode))h+=q});$("total").textContent=t;$("water").textContent=w;$("yogurt").textContent=y;$("coffee").textContent=c;$("tray").textContent=h;$("cutlery").textContent=h}
$("files").onchange=e=>{files=[...e.target.files];$("pre").innerHTML="";files.forEach(f=>{let i=document.createElement("img");i.src=URL.createObjectURL(f);$("pre").appendChild(i)});$("status").textContent=`${files.length} image(s) selected — ready.`;$("go").disabled=!files.length};
$("go").onclick=async()=>{rows=[];render();$("log").textContent="Starting…";try{for(let i=0;i<files.length;i++){ $("status").textContent=`Processing ${i+1}/${files.length}…`;let fd=new FormData();fd.append("file",files[i],files[i].name);fd.append("page",i+1);let r=await fetch("/api/ocr",{method:"POST",body:fd}),j=await r.json();if(!r.ok)throw Error(j.error||"OCR failed");rows.push(...j.rows);log(`Page ${i+1}: ${j.rows.length} rows detected.`);render();calc();$("prog").style.width=((i+1)/files.length*100)+"%"}$("status").textContent=`Completed — ${rows.length} rows detected.`}catch(e){$("status").textContent="Failed: "+e.message;log("ERROR: "+e.message)}};
$("copy").onclick=()=>{let s=`Total = ${$("total").textContent}\nWater = ${$("water").textContent}\nYoghurt = ${$("yogurt").textContent}\nCoffee = ${$("coffee").textContent}\nPaper Tray/Plate = ${$("tray").textContent}\nCutlery = ${$("cutlery").textContent}`;navigator.clipboard?.writeText(s);alert(s)};
$("clear").onclick=()=>location.reload();
</script></body></html>
